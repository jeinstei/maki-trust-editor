[project]
name = "maki-trust-editor"
version = "0.1.0"
description = "A QtPy app to review and edit maki session, project, and folder permissions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qtpy>=2.4",
    "tomlkit>=0.12",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Pick exactly one Qt binding. PySide6 is the default recommendation.
pyside6 = ["PySide6>=6.6"]
pyqt6 = ["PyQt6>=6.6"]
dev = ["pytest>=8", "black>=24", "ruff>=0.6"]

[project.scripts]
maki-trust-editor = "maki_trust_editor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maki_trust_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
